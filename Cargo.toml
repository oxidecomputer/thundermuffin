[workspace]
resolver = "2"

default-members = [
    "app",
]

members = [
    "app",
    "package",
    "xtask",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/oxidecomputer/thundermuffin"

[workspace.dependencies]
anyhow = "1.0.101"
cargo_metadata = "0.18"
clap = { version = "4.5.59", features = ["derive"] }
indoc = "2"
libc = "0.2"
socket2 = { version = "0.6.3", features = ["all"] }
toml = "0.8"
